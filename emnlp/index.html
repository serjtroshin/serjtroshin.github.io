<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Private</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1a202c; --muted:#64748b; --accent:#2563eb; --border:#e2e8f0; --err:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1120; --card:#111a2e; --text:#e2e8f0; --muted:#94a3b8; --accent:#3b82f6; --border:#24324b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  form { background:var(--card); border:1px solid var(--border); border-radius:12px;
         padding:28px 24px; width:100%; max-width:340px; }
  h1 { font-size:1.1rem; margin:0 0 4px; }
  p { color:var(--muted); font-size:.88rem; margin:0 0 18px; }
  input[type=password] { width:100%; padding:11px 13px; font-size:16px; border-radius:8px;
    border:1px solid var(--border); background:var(--bg); color:var(--text); }
  label.rem { display:flex; gap:7px; align-items:center; color:var(--muted);
              font-size:.82rem; margin:11px 1px 0; }
  button { width:100%; margin-top:14px; padding:11px; font-size:1rem; font-weight:600;
           background:var(--accent); color:#fff; border:0; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:var(--err); font-size:.85rem; margin-top:11px; min-height:1.2em; font-weight:600; }
</style>
</head>

</form>

const REM_KEY = 'emnlp2026-key';

async function unlock(pw) {
  const enc = new TextEncoder();
  const material = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: SALT, iterations: ITER, hash: 'SHA-256' },
    material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: IV }, key, DATA);
  return new TextDecoder().decode(plain);   // throws if the password is wrong
}

function show(html) {
  document.open(); document.write(html); document.close();
}

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Unlocking…'; err.textContent = '';
  try {
    const html = await unlock(pw);
    if (document.getElementById('rem').checked) {
      try { localStorage.setItem(REM_KEY, pw); } catch {}
    }
    show(html);
  } catch {
    err.textContent = 'Wrong password.';
    btn.disabled = false; btn.textContent = 'Unlock';
    document.getElementById('pw').select();
  }
});

// Already unlocked on this device? Go straight in.
(async () => {
  if (!crypto.subtle) {
    document.getElementById('err').textContent =
      'Needs https:// or localhost (browser crypto is disabled on file://).';
    return;
  }
  let saved = null;
  try { saved = localStorage.getItem(REM_KEY); } catch {}
  if (!saved) return;
  try { show(await unlock(saved)); }
  catch { try { localStorage.removeItem(REM_KEY); } catch {} }
})();
</script>
